[package]
name = "shashtna-console"
version = "0.1.0"
description = "شاشتنا Console — Windows shell around the web Console"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["core"]

[lib]
name = "shashtna_console_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
shashtna-console-core = { path = "core" }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.1"
serde_json = "1"
url = "2.5"
# Native HTTP for /api/console/v1. native-tls = Windows SChannel (system trust store).
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (generic credentials, protected per user by DPAPI).
keyring = { version = "3.6.3", features = ["windows-native"] }
# Same versions Tauri/wry use, for the WebView2 request and navigation hooks.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
